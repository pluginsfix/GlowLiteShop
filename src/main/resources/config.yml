  totem_of_undying:
    material: "TOTEM_OF_UNDYING"
    amount: 1
    name: "&#FFFF00◆ &fТотем бессмертия"
    lore:
      - "&fЛегендарный артефакт, спасающий"
      - "&fвладельца от неминуемой гибели."
    purchase-mode: "BOTH"
    currency: "coins"
    direct-price: 15000.0
    auction-min-bid: 5000.0
    auction-bid-step: 1000.0
    custom-model-data: 0
    enchanted: true

