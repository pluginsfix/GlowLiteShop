config-version: 1

currencies:
  coins:
    name: "Монеты"
    symbol: "⛃"
    type: "vault"
  sapphires:
    name: "Сапфиры"
    symbol: "✦"
    type: "internal"

rotation:
  interval-minutes: 120
  early-wipe: false
  early-wipe-interval-minutes: 30
  active-slots:
    - 11
    - 12
    - 13
    - 14
    - 15
    - 20
    - 21
    - 22
    - 23
    - 24

gui:
  title: "&#FFFF00◆ &fМагазин &8| &#FFFF00HolyLite"
  size: 54
  filler:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "
  navigation:
    kits:
      slot: 47
      material: "NETHERITE_SWORD"
      name: "&#FFFF00▶ &fМагазин китов"
      lore:
        - "&fНажмите, чтобы перейти"
        - "&fв раздел наборов снаряжения."
        - ""
        - "&#FFFF00◆ &fНажмите для перехода"
      command: "kits"
    boosters:
      slot: 49
      material: "BEACON"
      name: "&#FFFF00▶ &fМагазин бустеров"
      lore:
        - "&fНажмите, чтобы перейти"
        - "&fв раздел временных усилителей."
        - ""
        - "&#FFFF00◆ &fНажмите для перехода"
      command: "boosters"
    chest:
      slot: 51
      material: "ENDER_CHEST"
      name: "&#FFFF00▶ &fХранилище покупок"
      lore:
        - "&fВсе купленные и выигранные"
        - "&fпредметы попадают сюда."
        - ""
        - "&#FFFF00◆ &fВ хранилище: &#FFFF00{count} &fпредм."
        - "&#FFFF00◆ &fНажмите для открытия"
    rotation-indicator:
      slot: 4
      material: "CLOCK"
      name: "&#FFFF00▶ &fОбновление ассортимента"
      lore:
        - "&fДо смены товаров осталось: &#FFFF00{time}"
        - "&fРежим раннего вайпа: {early_wipe_status}"
        - ""
        - "&#FFFF00◆ &fТовары обновляются автоматически"

chest-gui:
  title: "&#FFFF00◆ &fХранилище покупок"
  size: 54
  filler:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "
  claim-all:
    slot: 49
    material: "HOPPER"
    name: "&#FFFF00▶ &fЗабрать все предметы"
    lore:
      - "&fПереместить все доступные"
      - "&fпредметы в ваш инвентарь."
      - ""
      - "&#FFFF00◆ &fНажмите для получения"
  back:
    slot: 45
    material: "ARROW"
    name: "&#FB8808▶ &fНазад в магазин"
    lore:
      - "&fВернуться в главное меню магазина."

